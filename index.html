<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHIP-8 Emulator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <header>
    	<h1>CHIP-8 Emulator</h1>
        <button id="config-btn">⚙</button>
        <button id="debug-btn">⌘</button>
    </header>

    <main class="container">
        <section class="video">
            <canvas id="screen" role="img"></canvas>
        </section>

        <section class="controls">
            <div class="buttons">
                <label class="upload" for="rom-upload">
                    <input type="file" id="rom-upload" accept=".ch8">
                    <span>LOAD ROM</span>
                </label>

                <button id="reset-rom">RESET</button>
                <button id="pause-rom">PAUSE</button>
            </div>

            <div class="speed-control">
                <span>Speed</span>
                <input type="range" id="speed" min="10" max="200" value="10">
        		<span id="speed-value">600 Hz</span>
    	    </div>
        </section>

        <!-- Mobile keypad -->
        <section class="keypad" id="keypad">
            <button data-key="1">1</button>
            <button data-key="2">2</button>
            <button data-key="3">3</button>
            <button data-key="C">C</button>

            <button data-key="4">4</button>
            <button data-key="5">5</button>
            <button data-key="6">6</button>
            <button data-key="D">D</button>

            <button data-key="7">7</button>
            <button data-key="8">8</button>
            <button data-key="9">9</button>
            <button data-key="E">E</button>

            <button data-key="A">A</button>
            <button data-key="0">0</button>
            <button data-key="B">B</button>
            <button data-key="F">F</button>
        </section>
    </main>

    <!-- Configuration modal -->
    <div id="config-overlay">
    	<div class="config-panel">

        	<h2>CONFIG</h2>

            <div class="rom-info" style="margin-bottom: 15px; font-size: 0.9rem;">
                <span>ROM: </span><strong id="rom-name">NONE</strong>
            </div>

        	<h3>QUIRKS</h3>

        	<label>
            	VF Reset
            	<input type="checkbox" id="vfReset">
        	</label>

        	<label>
            	Memory
            	<input type="checkbox" id="memory">
        	</label>

        	<label>
            	Clip
            	<input type="checkbox" id="clip">
        	</label>

        	<label>
            	Jump
            	<input type="checkbox" id="jump">
        	</label>

        	<label>
            	Shift
            	<input type="checkbox" id="shift">
        	</label>

            <label>
                Disp Wait
                <input type="checkbox" id="dispWait">
            </label>

        	<button id="close-config">CLOSE</button>
		</div>
	</div>

	<!-- Debug modal -->
	<div id="debug-overlay">
    	<div class="config-panel debug-panel">

        	<h2>DEBUG</h2>

        	<h3>CPU STATE</h3>

        	<div class="cpu-registers">
            	<div>
                	<span>PC</span>
                	<strong id="debug-pc">0200</strong>
            	</div>

            	<div>
                	<span>I</span>
                	<strong id="debug-i">0000</strong>
            	</div>

            	<div>
                	<span>SP</span>
                	<strong id="debug-sp">00</strong>
            	</div>

            	<div>
                	<span>DT</span>
                	<strong id="debug-dt">00</strong>
            	</div>

            	<div>
                	<span>ST</span>
                	<strong id="debug-st">00</strong>
            	</div>
        	</div>


        	<div class="v-registers">
            	<div><span>V0</span><strong id="debug-v0">00</strong></div>
            	<div><span>V1</span><strong id="debug-v1">00</strong></div>
            	<div><span>V2</span><strong id="debug-v2">00</strong></div>
            	<div><span>V3</span><strong id="debug-v3">00</strong></div>

            	<div><span>V4</span><strong id="debug-v4">00</strong></div>
            	<div><span>V5</span><strong id="debug-v5">00</strong></div>
            	<div><span>V6</span><strong id="debug-v6">00</strong></div>
            	<div><span>V7</span><strong id="debug-v7">00</strong></div>

            	<div><span>V8</span><strong id="debug-v8">00</strong></div>
            	<div><span>V9</span><strong id="debug-v9">00</strong></div>
            	<div><span>VA</span><strong id="debug-va">00</strong></div>
            	<div><span>VB</span><strong id="debug-vb">00</strong></div>

            	<div><span>VC</span><strong id="debug-vc">00</strong></div>
            	<div><span>VD</span><strong id="debug-vd">00</strong></div>
            	<div><span>VE</span><strong id="debug-ve">00</strong></div>
            	<div><span>VF</span><strong id="debug-vf">00</strong></div>
        	</div>

        	<button id="close-debug">CLOSE</button>

    	</div>
	</div>

    <footer>
        <p>Built by André Moreira <a href="https://github.com/andremrr" target="_blank">GitHub</a></p>
    </footer>

    <script type="module" src="main.js"></script>
    <script>
        if ("serviceWorker" in navigator)
            navigator.serviceWorker.register("./sw.js");
    </script>
</body>
</html>
